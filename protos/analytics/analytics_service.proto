syntax = "proto3";

package matryoshka.analytics;

service AnalyticsService {
  rpc RecordEvent(RecordEventRequest) returns (RecordEventResponse);
  rpc GetLedgerEvents(GetLedgerEventsRequest) returns (GetLedgerEventsResponse);
  rpc RunMonteCarlo(RunMonteCarloRequest) returns (RunMonteCarloResponse);
  rpc GetAnalyticsSummary(GetAnalyticsSummaryRequest) returns (GetAnalyticsSummaryResponse);
}

message AuditEventMessage {
  string event_id = 1;
  string timestamp = 2;
  string trace_id = 3;
  uint32 product_id = 4;
  string product_name = 5;
  string event_type = 6;
  string actor_type = 7;
  float paper_localization_pct = 8;
  float defacto_localization_pct = 9;
  float vulnerability_gap_pct = 10;
  uint32 chokepoints_count = 11;
  string digital_signature = 12;
  string payload_json = 13;
}

message RecordEventRequest {
  AuditEventMessage event = 1;
}

message RecordEventResponse {
  bool success = 1;
  string event_id = 2;
  string message = 3;
}

message GetLedgerEventsRequest {
  uint32 product_id = 1;
  uint32 limit = 2;
}

message GetLedgerEventsResponse {
  repeated AuditEventMessage events = 1;
  uint32 total_count = 2;
}

message RunMonteCarloRequest {
  uint32 product_id = 1;
  uint32 iterations_count = 2;
  repeated string blocked_countries = 3;
}

message MonteCarloIterationResult {
  uint32 iteration = 1;
  bool is_paralyzed = 2;
  uint32 days_to_halt = 3;
  double loss_rub = 4;
  string failed_chokepoint = 5;
}

message RunMonteCarloResponse {
  string run_id = 1;
  uint32 product_id = 2;
  uint32 total_iterations = 3;
  float paralysis_probability_pct = 4;
  float median_days_to_halt = 5;
  double value_at_risk_rub = 6;
  repeated MonteCarloIterationResult sample_iterations = 7;
  string executive_summary = 8;
}

message GetAnalyticsSummaryRequest {
  uint32 product_id = 1;
}

message TimeSeriesDataPoint {
  string timestamp = 1;
  float paper_localization_pct = 2;
  float defacto_localization_pct = 3;
}

message GetAnalyticsSummaryResponse {
  uint32 product_id = 1;
  uint64 total_events_recorded = 2;
  float current_vulnerability_gap_pct = 3;
  uint32 active_chokepoints_count = 4;
  repeated TimeSeriesDataPoint localization_trend = 5;
  string storage_engine = 6;
}
